<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rankora AI — Ecommerce SEO Scanner</title>
<style>
:root{--bg:#0a1128;--card:#111a3a;--line:#1f2b57;--tx:#e7ebff;--mu:#8f9bc7;--pu:#8b5cf6;--bl:#3b82f6;--ok:#22c55e;--wa:#f59e0b;--er:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:220px;background:#080e22;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;margin:0 8px 24px}.logo b{background:linear-gradient(90deg,var(--pu),var(--bl));-webkit-background-clip:text;color:transparent}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--mu);text-decoration:none;margin-bottom:4px}nav a.on,nav a:hover{background:var(--card);color:var(--tx)}nav a.on{box-shadow:inset 3px 0 var(--pu)}
main{flex:1;padding:24px;max-width:1100px;min-width:0}h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:200px;background:#0a1128;border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:8px;font-size:15px}
button,.btn{background:linear-gradient(90deg,var(--pu),var(--bl));color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block}
button.sec,.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stat b{font-size:28px;display:block}.stat span,.mu{color:var(--mu)}
.bar{height:8px;background:#0a1128;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--bl))}
.err{color:#fecaca;background:#3b1219;border:1px solid #7f1d1d;padding:10px;border-radius:8px;margin-top:10px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase}.high{background:#7f1d1d}.medium{background:#78350f}.low{background:#1e3a8a}.info{background:#334155}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer}.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mu)}
.wrap{word-break:break-all}.chip{display:inline-block;background:#0a1128;border:1px solid var(--line);padding:3px 10px;border-radius:99px;margin:3px;font-size:13px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px}.logo{margin:0 10px 0 0}nav{display:flex;gap:4px}nav a{margin:0;white-space:nowrap}main{padding:16px}}
@media print{aside,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}}
</style></head><body>
<aside><div class="logo">Rankora <b>AI</b></div><nav><a href="#overview">Overview</a><a href="#scanner">Website Scanner</a><a href="#reports">SEO Reports</a><a href="#settings">Settings</a></nav></aside>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
const col=n=>n>=80?'var(--ok)':n>=60?'var(--wa)':'var(--er)';let current=null,timer=null;
const scanBox=()=>`<form class="card" id="f"><div class="row"><input id="u" placeholder="https://your-store.com" aria-label="Website URL" required><button id="go">Scan Website</button></div><div class="mu" style="margin-top:8px;font-size:13px">Scans public pages only. Respects robots.txt. Never touches login-protected pages.</div><div id="msg"></div></form>`;
function bind(){const f=$('#f');if(f)f.onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#msg').innerHTML='';try{const {id}=await api('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('#u').value})});current=id;location.hash='#scanner';route();}catch(er){$('#msg').innerHTML=`<div class="err">${esc(er.message)}</div>`;$('#go').disabled=false}}}
async function overview(){const l=await api('/api/scans'),d=l.filter(x=>x.status==='done'),avg=d.length?Math.round(d.reduce((s,x)=>s+x.score,0)/d.length):'–';
$('#app').innerHTML=`<h1>Overview</h1><p class="sub">Scan any public store and get a transparent SEO score.</p>${scanBox()}<div class="grid"><div class="card stat"><b>${l.length}</b><span>Total scans</span></div><div class="card stat"><b>${d[0]?d[0].score+'/100':'–'}</b><span>Latest score</span></div><div class="card stat"><b>${avg}</b><span>Average score</span></div></div><div class="card"><b>Recent scans</b>${list(l.slice(0,5))}</div><p class="mu" style="font-size:13px">Rankora analyses your real page HTML. It does not have Google rankings, traffic, or sales data.</p>`;bind()}
const list=l=>l.length?`<div class="tbl"><table><tr><th>URL</th><th>Score</th><th>Status</th><th>Date</th><th></th></tr>${l.map(x=>`<tr><td class="wrap">${esc(x.url)}</td><td>${x.score??'–'}</td><td>${esc(x.status)}${x.error?': '+esc(x.error):''}</td><td>${esc(x.created_at)}</td><td><a href="#scanner/${x.id}" style="color:var(--bl)">View</a></td></tr>`).join('')}</table></div>`:'<p class="mu">No scans yet.</p>';
async function scanner(id){clearInterval(timer);if(id)current=+id;$('#app').innerHTML=`<h1>Website Scanner</h1><p class="sub">Homepage plus a limited number of same-domain public pages.</p>${scanBox()}<div id="out"></div>`;bind();if(current)poll()}
async function poll(){const out=$('#out');const tick=async()=>{try{const s=await api('/api/scans/'+current);if(s.status==='running'){const p=s.progress||{pct:1,message:'Working…'};out.innerHTML=`<div class="card"><b>Scanning…</b><p class="mu">${esc(p.message)}</p><div class="bar"><i style="width:${p.pct}%"></i></div></div>`}else{clearInterval(timer);out.innerHTML=s.status==='failed'?`<div class="err"><b>Scan failed:</b> ${esc(s.error)}</div>`:report(s.result,s.id)}}catch(e){clearInterval(timer);out.innerHTML=`<div class="err">${esc(e.message)}</div>`}};await tick();timer=setInterval(tick,900)}
function report(r,id){const issues=r.issues.map(i=>`<details><summary><span class="pill ${i.severity}">${i.severity}</span> <b>${esc(i.title)}</b> <span class="mu">${i.affected.length?'('+i.affected.length+' affected)':''}</span></summary><p><b>Impact:</b> ${esc(i.impact)}</p><p><b>How to fix:</b> ${esc(i.fix)}</p>${i.affected.length?'<ul class="wrap">'+i.affected.slice(0,15).map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>':''}</details>`).join('')||'<p class="mu">No issues found.</p>';
return `<div class="card"><div class="row" style="align-items:center;gap:24px"><div class="ring" style="background:conic-gradient(${col(r.score.total)} ${r.score.total*3.6}deg,#0a1128 0);"><span style="background:var(--card);width:92px;height:92px;border-radius:50%;display:grid;place-items:center">${r.score.total}</span></div><div style="flex:1;min-width:220px"><b class="wrap">${esc(r.finalUrl)}</b><div class="mu">HTTPS ${r.https?'✓':'✗'} · robots.txt ${r.robotsTxt?'✓':'✗'} · sitemap.xml ${r.sitemap?'✓':'✗'} · ${r.pages.length} pages scanned</div><div class="noprint" style="margin-top:10px"><a class="btn" href="/api/scans/${id}/report.csv">Download CSV</a> <button class="sec" onclick="print()">Save as PDF</button></div></div></div></div>
<div class="card"><b>Score breakdown (out of 100)</b>${r.score.categories.map(c=>`<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>${esc(c.name)}</span><span>${c.earned}/${c.max}</span></div><div class="bar"><i style="width:${c.earned/c.max*100}%"></i></div><div class="mu" style="font-size:12px">${c.parts.map(p=>`${esc(p.label)}: ${p.earned}/${p.max}`).join(' · ')}</div></div>`).join('')}</div>
<div class="card"><b>Issues, impact & fixes</b>${issues}</div>
<div class="card"><b>Keyword suggestions</b><p class="mu" style="font-size:13px">${esc(r.keywordNote)}</p>${r.keywords.map(k=>`<span class="chip" title="found in: ${esc(k.foundIn.join(', '))}">${esc(k.keyword)} <span class="mu">×${k.occurrences}</span></span>`).join('')||'<span class="mu">Not enough text found.</span>'}</div>
<div class="card"><b>Page-by-page findings</b><div class="tbl"><table><tr><th>Page</th><th>HTTP</th><th>Title</th><th>Meta desc</th><th>H1</th><th>Img alt missing</th><th>Words</th><th>Canonical</th><th>Robots</th><th>Mobile</th></tr>${r.pages.map(p=>`<tr><td class="wrap">${esc(p.url)}</td><td>${p.status}</td><td>${esc(p.title)||'<i class=mu>missing</i>'}</td><td>${p.description?p.description.length+' chars':'<i class=mu>missing</i>'}</td><td>${p.h1Count}</td><td>${p.images.missingAlt}/${p.images.total}</td><td>${p.wordCount}</td><td>${p.canonical?'✓':'✗'}</td><td>${esc(p.robots)}</td><td>${p.viewport?'✓':'✗'}</td></tr>`).join('')}</table></div></div>
${r.skipped.length?`<div class="card"><b>Skipped</b><ul class="wrap mu">${r.skipped.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}`}
async function reports(){const l=await api('/api/scans');$('#app').innerHTML=`<h1>SEO Reports</h1><p class="sub">Saved scan history.</p><div class="card">${l.length?`<div class="tbl"><table><tr><th>URL</th><th>Score</th><th>Status</th><th>Date</th><th></th></tr>${l.map(x=>`<tr><td class="wrap">${esc(x.url)}</td><td>${x.score??'–'}</td><td>${esc(x.status)}</td><td>${esc(x.created_at)}</td><td><a href="#scanner/${x.id}" style="color:var(--bl)">View</a> ${x.status==='done'?`· <a style="color:var(--bl)" href="/api/scans/${x.id}/report.csv">CSV</a>`:''} · <a href="#" style="color:var(--er)" data-del="${x.id}">Delete</a></td></tr>`).join('')}</table></div>`:'<p class="mu">No scans yet.</p>'}</div>`;
document.querySelectorAll('[data-del]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(confirm('Delete this report?')){await api('/api/scans/'+a.dataset.del,{method:'DELETE'});reports()}})}
async function settings(){const s=await api('/api/settings');$('#app').innerHTML=`<h1>Settings</h1><p class="sub">Crawl limits applied to every scan.</p><form class="card" id="sf">${[['maxPages','Max pages per scan (1–25)'],['delayMs','Delay between requests, ms (0–5000)'],['timeout','Request timeout, ms (2000–15000)']].map(([k,l])=>`<p><label>${l}<br><input name="${k}" type="number" value="${s[k]}" required></label></p>`).join('')}<button>Save settings</button><div id="sm"></div></form><div class="card mu">Always on: public http/https only · localhost/private IPs blocked · redirects re-validated · 1.5 MB response cap · robots.txt honoured · login/cart/checkout paths skipped.</div>`;
$('#sf').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('#sm').innerHTML='<p style="color:var(--ok)">Saved.</p>'}catch(er){$('#sm').innerHTML=`<div class="err">${esc(er.message)}</div>`}}}
function route(){clearInterval(timer);const [v,a]=(location.hash||'#overview').slice(1).split('/');document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.hash==='#'+v));({overview,scanner:()=>scanner(a),reports,settings}[v]||overview)().catch(e=>$('#app').innerHTML=`<div class="err">${esc(e.message)}</div>`)}
addEventListener('hashchange',route);route();
</script></body></html>
